# Integracao continua (SPEC-006 D4): testes unitarios e verificacoes
# estaticas. A avaliacao com LLM (RF-62) roda por script local
# (scripts/quality-gate.sh), para que nenhuma API key vire segredo no GitHub.
name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: OCR local (mesmos pacotes da imagem)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - name: Dependencias (PyTorch so para CPU, como na imagem)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Verificacao estatica (nomes indefinidos, imports sem uso, sintaxe)
        run: |
          pip install ruff==0.8.6
          ruff check --select F,E9 src tests
          python -m compileall -q src
      - name: Testes unitarios
        env:
          DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus
          HF_HUB_OFFLINE: "1"
        run: python -m unittest discover -s tests/unit -v
      - name: CT-46 - logs, trechos e metricas sem token, chave nem texto
        env:
          DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus
          HF_HUB_OFFLINE: "1"
        run: python -m unittest tests.integration.test_sensitive_data_leak -v

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testes (Vitest)
        run: npm test
      - name: Build de producao
        run: npm run build

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Realm de desenvolvimento valido e sem endereco fixo do frontend
        run: |
          python3 -c "import json; json.load(open('infra/keycloak/nexus-realm.json'))"
          if grep -n 'localhost:4200' infra/keycloak/nexus-realm.json; then exit 1; fi
          grep -q 'NEXUS_FRONTEND_URL' compose.yaml
          grep -q 'NEXUS_BACKEND_CLIENT_SECRET' infra/keycloak/nexus-realm.json
          grep -q 'NEXUS_BACKEND_CLIENT_SECRET' compose.yaml
          # Tema de login (SPEC-011): realm aponta para ele e o pai e o keycloak.v2.
          grep -q '"loginTheme": "nexus"' infra/keycloak/nexus-realm.json
          grep -qx 'parent=keycloak.v2' infra/keycloak/themes/nexus/login/theme.properties
          test -f infra/keycloak/themes/nexus/login/resources/css/nexus.css
      - name: Compose valido, com os perfis opcionais
        run: |
          docker compose config -q
          docker compose --profile observabilidade --profile backup config -q
      - name: Scripts de backup (sintaxe POSIX) e de validacao (bash)
        run: |
          for script in scripts/backup.sh scripts/restore.sh scripts/backup-loop.sh scripts/backup-common.sh; do
            sh -n "$script"
          done
          for script in scripts/validation/*.sh scripts/quality-gate.sh; do
            bash -n "$script"
          done

  # SPEC-006 D10: backup e restauracao contra um PostgreSQL 16 real, com o
  # Qdrant simulado. O ensaio completo no Docker e o CT-47 (local).
  backup-scripts:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Cliente PostgreSQL 16 e jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16 jq
      - name: Ensaio de backup.sh e restore.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: nexus
          PGPASSWORD: nexus
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          bash scripts/validation/backup-scripts-check.sh
