name: sync-lock (temporario)
on:
  push:
    branches: [chore/sync-lock]
permissions:
  contents: write
jobs:
  lock:
    if: "!contains(github.event.head_commit.message, '[lock]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sincroniza o package-lock.json
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --dry-run > /dev/null
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: sincroniza package-lock [lock]" || echo "sem mudanca"
          git push origin HEAD:chore/sync-lock
