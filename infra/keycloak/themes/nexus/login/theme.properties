# Tema de login do Nexus (SPEC-011, ADR 0012).
# Herda o keycloak.v2 (PatternFly 5) e acrescenta css/nexus.css. A chave "styles"
# substitui a do pai, por isso repete css/styles.css do keycloak.v2 antes da nossa.
# "stylesCommon", "meta" e as classes kc* continuam herdadas.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/nexus.css
