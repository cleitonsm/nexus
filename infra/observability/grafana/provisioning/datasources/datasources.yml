# Fontes de dados do Grafana do perfil "observabilidade" (SPEC-006 D1).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: nexus-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Jaeger
    uid: nexus-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
