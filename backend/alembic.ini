# Uso manual do Alembic, a partir de backend/ (ou de /app no container):
#   alembic history | alembic downgrade -1 | alembic revision -m "descricao"
# A aplicacao nao le este arquivo: as migracoes sao aplicadas na subida da API
# por src/infrastructure/database/migrate.py.
[alembic]
script_location = src/infrastructure/database/alembic
prepend_sys_path = .
